name: Windows executable

# Builds the Windows command-line executable from the source of REF and runs it on the
# example files. With ATTACH 'true', REF is a release tag: the full runs are made as well
# and the executable is attached to that release. Tags made before the global variable
# fstat was renamed need the earlier version of this file, which renamed it at compile time.
# It runs when this branch is pushed; nothing runs on master.

on:
  push:
    branches: [build-windows-executable]

permissions:
  contents: write   # to attach the executable to the release

env:
  REF: master
  ATTACH: 'false'
  EXE: BayeScan_win64bits_cmd_line.exe

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-libgomp

      - name: Build a statically linked executable
        shell: msys2 {0}
        run: |
          set -eu
          g++ --version | head -1
          pacman -Ql mingw-w64-ucrt-x86_64-libgomp | grep -i "libgomp"
          g++ -O3 -std=gnu++11 -fopenmp -static -o "$EXE" start.cpp beta.cpp dirichlet.cpp RJupdates.cpp MHupdates.cpp likelihood.cpp read_write.cpp anyoption.cpp
          strip "$EXE"
          ls -l "$EXE"
          sha256sum "$EXE"
          objdump -p "$EXE" | grep "DLL Name" | sort -u
          if objdump -p "$EXE" | grep "DLL Name" | grep -q -i -E "lib(gomp|winpthread|stdc|gcc)"; then
            echo "the executable still needs a compiler library"; exit 1
          fi

      - name: Run on every example file, short chains
        shell: bash
        run: |
          set -eu
          mkdir -p smoke
          SHORT="-threads 4 -n 1000 -thin 10 -nbp 5 -pilot 1000 -burn 2000"
          run() {
            name=$1; want=$2; shift 2
            "./$EXE" "$@" -od smoke -o "$name" $SHORT > "smoke/$name.log" 2>&1 || { tail -20 "smoke/$name.log"; echo "$name failed"; exit 1; }
            n=$(( $(wc -l < "smoke/${name}_fst.txt") - 1 ))
            echo "$name: exit 0, $n loci"
            [ "$n" -eq "$want" ] || { echo "expected $want loci"; exit 1; }
          }
          "./$EXE" -help 2>&1 | sed -n 1,4p || true
          run snps         1000 input_examples/test_SNPs.txt
          run snps_discard  994 input_examples/test_SNPs.txt -d input_examples/discarded.txt
          run geno          100 input_examples/test_genotype_SNP.txt -snp
          run aflp_bin      100 input_examples/test_binary_AFLP.txt
          run aflp_int      100 input_examples/test_band_intensity_AFLP.txt
          run msats         106 input_examples/test_msats.txt
          # the option whose variable had the name of a function of the C library
          "./$EXE" input_examples/test_SNPs.txt -fstat -od smoke -o fstat_only $SHORT > smoke/fstat_only.log 2>&1 || { tail -20 smoke/fstat_only.log; echo "fstat_only failed"; exit 1; }
          echo "fstat_only: exit 0"

      - name: Default options on the SNP example
        if: env.ATTACH == 'true'
        shell: bash
        run: |
          set -eu
          mkdir -p default
          start=$(date +%s)
          "./$EXE" input_examples/test_SNPs.txt -od default -o snps -threads 4 > default/snps.log 2>&1
          echo "seconds: $(( $(date +%s) - start ))"
          q05=$(awk 'NR>1 && $4<0.05 {n++} END{print n+0}' default/snps_fst.txt)
          q01=$(awk 'NR>1 && $4<0.01 {n++} END{print n+0}' default/snps_fst.txt)
          echo "loci with q<0.05: $q05, with q<0.01: $q01 (2.2 and 2.3 on Linux: 18 and 16; 2.1: 35 and 23)"
          if [ "$q05" -lt 14 ] || [ "$q05" -gt 22 ]; then echo "outside the accepted range 14 to 22"; exit 1; fi

      - name: Binary AFLP example, the data concerned by the correction of 2.3
        if: env.ATTACH == 'true'
        shell: bash
        run: |
          set -eu
          start=$(date +%s)
          "./$EXE" input_examples/test_binary_AFLP.txt -od default -o aflp -threads 4 -n 20000 > default/aflp.log 2>&1
          echo "seconds: $(( $(date +%s) - start ))"
          fst=$(awk 'NR>1 {s+=$6} END{printf "%.4f", s/(NR-1)}' default/aflp_fst.txt)
          echo "mean FST: $fst (2.3 on Linux and macOS: 0.216; 2.2: 0.199)"
          awk -v f="$fst" 'BEGIN{ exit !(f > 0.210 && f < 0.223) }' || { echo "outside the accepted range 0.210 to 0.223"; exit 1; }

      - name: Attach the executable to the release
        if: env.ATTACH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum "$EXE"
          gh release upload "$REF" "$EXE" --repo "$GITHUB_REPOSITORY"
